<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B1B3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PA Guests">
<title>PA Guest Tracker</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Reset & Variables ─────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0B1B3A;--navy-mid:#112247;--navy-light:#1A2F5A;--navy-border:#1E3666;
  --gold:#C9A84C;--gold-light:#E8C76A;--gold-dim:rgba(201,168,76,0.15);--gold-border:rgba(201,168,76,0.3);
  --white:#FFFFFF;--off-white:#F4F1EB;--text-primary:#F4F1EB;--text-secondary:rgba(244,241,235,0.6);--text-muted:rgba(244,241,235,0.35);
  --surface:#112247;--surface-hover:#1A2F5A;--surface-active:#1E3666;
  --danger:#E05252;--danger-dim:rgba(224,82,82,0.15);
  --success:#52C07A;--success-dim:rgba(82,192,122,0.15);
  --warning:#E0A952;--info:#5295E0;--info-dim:rgba(82,149,224,0.15);
  --status-new:#5295E0;--status-attending:#C9A84C;--status-interested:#A07CE0;
  --status-converted:#52C07A;--status-not-interested:#E05252;--status-ghosted:#8A8FA8;
  --radius:12px;--radius-sm:8px;--radius-lg:16px;
  --nav-width:240px;--header-height:60px;
  --font-display:'Playfair Display',Georgia,serif;
  --font-body:'DM Sans',system-ui,sans-serif;
  --transition:0.2s ease;
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--navy);color:var(--text-primary);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--navy)}
::-webkit-scrollbar-thumb{background:var(--navy-border);border-radius:3px}
h1,h2,h3{font-family:var(--font-display);line-height:1.2}
h1{font-size:1.8rem}h2{font-size:1.4rem}h3{font-size:1.1rem}
p{line-height:1.6;color:var(--text-secondary)}
a{color:var(--gold);text-decoration:none}

/* ── Layout ─────────────────────────────────────────────────── */
#app{display:flex;min-height:100vh}
#sidebar{width:var(--nav-width);background:var(--navy-mid);border-right:1px solid var(--navy-border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform var(--transition)}
#sidebar.hidden{display:none}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid var(--navy-border)}
.sidebar-logo .logo-mark{font-family:var(--font-display);font-size:1.3rem;color:var(--gold);letter-spacing:.02em}
.sidebar-logo .logo-sub{font-size:.7rem;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.sidebar-logo .logo-ver{font-size:.6rem;color:var(--text-muted);letter-spacing:.08em;margin-top:2px}
nav.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--text-secondary);font-size:.875rem;font-weight:500;cursor:pointer;transition:all var(--transition);border-left:3px solid transparent;margin:1px 0}
.nav-item:hover{color:var(--text-primary);background:var(--surface-hover)}
.nav-item.active{color:var(--gold);background:var(--gold-dim);border-left-color:var(--gold)}
.nav-item svg{width:18px;height:18px;opacity:.7;flex-shrink:0}
.nav-item.active svg{opacity:1}
.sidebar-bottom{padding:16px;border-top:1px solid var(--navy-border)}
.user-info{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0}
.user-name{font-size:.8rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em}
#main{flex:1;margin-left:var(--nav-width);display:flex;flex-direction:column;min-height:100vh}
#main.full-width{margin-left:0}
#header{height:var(--header-height);background:var(--navy-mid);border-bottom:1px solid var(--navy-border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50}
.header-title{font-family:var(--font-display);font-size:1.1rem}
.header-actions{display:flex;align-items:center;gap:10px}
#page-content{flex:1;padding:24px;max-width:1200px;width:100%}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90}
#sidebar-overlay.visible{display:block}

/* ── Lang Toggle ─────────────────────────────────────────────── */
.lang-toggle{display:flex;gap:2px;background:var(--navy);border:1px solid var(--navy-border);border-radius:20px;padding:3px}
.lang-btn{padding:4px 8px;border:none;background:transparent;color:var(--text-muted);font-size:.7rem;font-weight:600;border-radius:14px;cursor:pointer;transition:all var(--transition);font-family:var(--font-body)}
.lang-btn.active{background:var(--gold);color:var(--navy)}
.hamburger-btn{display:none;background:none;border:none;cursor:pointer;padding:6px;color:var(--text-primary)}

/* ── Cards ─────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--navy-border);border-radius:var(--radius);padding:20px;transition:border-color var(--transition)}
.card:hover{border-color:var(--gold-border)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-family:var(--font-display);font-size:1rem}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--navy-border);border-radius:var(--radius);padding:16px 20px;position:relative;overflow:hidden;transition:all var(--transition)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent-color,var(--gold))}
.stat-card:hover{border-color:var(--accent-color,var(--gold-border));transform:translateY(-1px)}
.stat-value{font-family:var(--font-display);font-size:2rem;font-weight:700;line-height:1;margin-bottom:6px}
.stat-label{font-size:.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;font-weight:500}

/* ── Buttons ─────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--radius-sm);font-size:.875rem;font-weight:500;font-family:var(--font-body);cursor:pointer;border:none;transition:all var(--transition);white-space:nowrap;text-decoration:none}
.btn-primary{background:var(--gold);color:var(--navy)}.btn-primary:hover{background:var(--gold-light);transform:translateY(-1px)}
.btn-secondary{background:var(--surface-active);color:var(--text-primary);border:1px solid var(--navy-border)}.btn-secondary:hover{border-color:var(--gold-border)}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--navy-border)}.btn-ghost:hover{color:var(--text-primary);border-color:var(--gold-border)}
.btn-danger{background:var(--danger-dim);color:var(--danger);border:1px solid rgba(224,82,82,.3)}.btn-danger:hover{background:var(--danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:.8rem}.btn-lg{padding:12px 24px;font-size:1rem}
.btn-full{width:100%;justify-content:center}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

/* ── Forms ─────────────────────────────────────────────────── */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:.8rem;font-weight:500;color:var(--text-secondary);margin-bottom:6px;letter-spacing:.02em}
.form-label .required{color:var(--gold);margin-left:3px}
.form-control{width:100%;background:var(--navy);border:1px solid var(--navy-border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text-primary);font-size:.875rem;font-family:var(--font-body);transition:border-color var(--transition);outline:none}
.form-control:focus{border-color:var(--gold)}.form-control::placeholder{color:var(--text-muted)}
select.form-control{cursor:pointer}select.form-control option{background:var(--navy-mid)}
textarea.form-control{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-error{font-size:.75rem;color:var(--danger);margin-top:4px}
.radio-group{display:flex;gap:8px}
.radio-option{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;background:var(--navy);border:1px solid var(--navy-border);border-radius:var(--radius-sm);cursor:pointer;font-size:.875rem;color:var(--text-secondary);transition:all var(--transition)}
.radio-option input{display:none}.radio-option.selected{background:var(--gold-dim);border-color:var(--gold);color:var(--gold)}

/* ── Guest Items ─────────────────────────────────────────────── */
.guest-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface);border:1px solid var(--navy-border);border-radius:var(--radius);margin-bottom:8px;cursor:pointer;transition:all var(--transition)}
.guest-item:hover{border-color:var(--gold-border);background:var(--surface-hover)}
.guest-avatar{width:38px;height:38px;border-radius:50%;background:var(--gold-dim);border:1.5px solid var(--gold-border);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;flex-shrink:0;font-family:var(--font-display)}
.guest-info{flex:1;margin:0 12px}
.guest-name{font-weight:600;font-size:.9rem}
.guest-meta{font-size:.75rem;color:var(--text-muted);margin-top:2px}

/* ── Status Badges ─────────────────────────────────────────── */
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.status-badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.badge-new{color:var(--status-new);background:rgba(82,149,224,.12);border:1px solid rgba(82,149,224,.25)}
.badge-attending{color:var(--status-attending);background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.25)}
.badge-interested{color:var(--status-interested);background:rgba(160,124,224,.12);border:1px solid rgba(160,124,224,.25)}
.badge-converted{color:var(--status-converted);background:rgba(82,192,122,.12);border:1px solid rgba(82,192,122,.25)}
.badge-not-interested{color:var(--status-not-interested);background:rgba(224,82,82,.12);border:1px solid rgba(224,82,82,.25)}
.badge-ghosted{color:var(--status-ghosted);background:rgba(138,143,168,.12);border:1px solid rgba(138,143,168,.25)}

/* ── Page Headers ────────────────────────────────────────────── */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-family:var(--font-display);font-size:1.6rem}
.page-subtitle{font-size:.85rem;color:var(--text-muted);margin-top:4px}

/* ── Filter Bar ─────────────────────────────────────────────── */
.filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-input{flex:1;min-width:200px;position:relative}
.search-input input{padding-left:36px}
.search-input .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);width:15px;height:15px}
.filter-chip{padding:6px 14px;border-radius:20px;font-size:.78rem;font-weight:500;cursor:pointer;border:1px solid var(--navy-border);background:var(--navy);color:var(--text-secondary);transition:all var(--transition);white-space:nowrap}
.filter-chip.active{background:var(--gold-dim);border-color:var(--gold-border);color:var(--gold)}

/* ── Modal ─────────────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
@media(min-width:640px){.modal-overlay{align-items:center}}
.modal{background:var(--navy-mid);border:1px solid var(--navy-border);border-radius:var(--radius-lg) var(--radius-lg) 0 0;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:24px;animation:slideUp .3s ease}
@media(min-width:640px){.modal{border-radius:var(--radius-lg)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-family:var(--font-display);font-size:1.2rem}
.modal-close{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px;font-size:1.2rem;transition:color var(--transition)}.modal-close:hover{color:var(--text-primary)}
.modal-footer{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}

/* ── Toast ─────────────────────────────────────────────────── */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:var(--radius-sm);font-size:.875rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:slideInRight .3s ease;max-width:320px}
.toast-success{background:var(--success);color:var(--navy)}.toast-error{background:var(--danger);color:#fff}.toast-info{background:var(--info);color:#fff}

/* ── Empty & Loading ─────────────────────────────────────────── */
.empty-state{text-align:center;padding:48px 24px;color:var(--text-muted)}
.empty-state-icon{font-size:3rem;margin-bottom:12px;display:block}
.empty-state p{font-size:.9rem;color:var(--text-muted);margin-bottom:16px}
.loading-spinner{display:flex;align-items:center;justify-content:center;padding:40px}
.spinner{width:32px;height:32px;border:3px solid var(--navy-border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}

/* ── Login ─────────────────────────────────────────────────── */
#login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);position:relative;overflow:hidden}
#login-page::before{content:'';position:absolute;top:-30%;left:-20%;width:60%;height:60%;background:radial-gradient(circle,rgba(201,168,76,.08) 0%,transparent 70%);pointer-events:none}
.login-card{width:100%;max-width:400px;margin:24px;background:var(--navy-mid);border:1px solid var(--navy-border);border-radius:var(--radius-lg);padding:36px;position:relative;z-index:1}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo-mark{font-family:var(--font-display);font-size:2rem;color:var(--gold);display:block;line-height:1}
.login-logo-sub{font-size:.72rem;color:var(--text-muted);letter-spacing:.15em;text-transform:uppercase;margin-top:6px;display:block}
.login-logo-ver{font-size:.65rem;color:var(--text-muted);letter-spacing:.1em;margin-top:4px;display:block}
.login-divider{border:none;border-top:1px solid var(--navy-border);margin:24px 0}
.register-guest-btn{width:100%;padding:12px;background:transparent;border:1px dashed var(--gold-border);border-radius:var(--radius-sm);color:var(--gold);font-size:.875rem;font-weight:500;font-family:var(--font-body);cursor:pointer;transition:all var(--transition);display:flex;align-items:center;justify-content:center;gap:8px}
.register-guest-btn:hover{background:var(--gold-dim);border-style:solid}

/* ── Register ─────────────────────────────────────────────── */
#register-page{min-height:100vh;background:var(--navy);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px 48px;position:relative;overflow:hidden}
#register-page::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--gold) 0%,var(--gold-light) 50%,var(--gold) 100%)}
.register-card{width:100%;max-width:520px;background:var(--navy-mid);border:1px solid var(--navy-border);border-radius:var(--radius-lg);padding:28px 24px;margin-top:20px}
.register-section-title{font-size:.72rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--navy-border)}

/* ── Meeting Cards ─────────────────────────────────────────── */
.meeting-card{background:var(--surface);border:1px solid var(--navy-border);border-radius:var(--radius);padding:16px 20px;margin-bottom:10px;cursor:pointer;transition:all var(--transition);display:flex;align-items:center;justify-content:space-between}
.meeting-card:hover{border-color:var(--gold-border)}
.meeting-date-badge{display:flex;flex-direction:column;align-items:center;justify-content:center;width:52px;height:52px;background:var(--gold-dim);border:1px solid var(--gold-border);border-radius:var(--radius-sm);flex-shrink:0}
.meeting-date-day{font-family:var(--font-display);font-size:1.2rem;font-weight:700;color:var(--gold);line-height:1}
.meeting-date-month{font-size:.6rem;color:var(--gold);text-transform:uppercase;letter-spacing:.08em}

/* ── Attendance ─────────────────────────────────────────────── */
.attendance-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--navy);border:1px solid var(--navy-border);border-radius:var(--radius-sm);margin-bottom:6px;transition:all var(--transition)}
.attendance-item.present{background:var(--success-dim);border-color:rgba(82,192,122,.3)}
.toggle-switch{position:relative;width:44px;height:24px}
.toggle-switch input{display:none}
.toggle-track{position:absolute;inset:0;background:var(--navy-border);border-radius:12px;cursor:pointer;transition:background var(--transition)}
.toggle-track::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform var(--transition)}
.toggle-switch input:checked+.toggle-track{background:var(--success)}
.toggle-switch input:checked+.toggle-track::after{transform:translateX(20px)}

/* ── Followup ─────────────────────────────────────────────── */
.followup-timeline{position:relative;padding-left:24px}
.followup-timeline::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:1px;background:var(--navy-border)}
.followup-item{position:relative;margin-bottom:16px}
.followup-item::before{content:'';position:absolute;left:-20px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--gold);border:2px solid var(--navy-mid)}
.followup-date{font-size:.72rem;color:var(--text-muted);margin-bottom:4px}
.followup-notes{font-size:.85rem;background:var(--navy);border:1px solid var(--navy-border);border-radius:var(--radius-sm);padding:10px 12px}
.followup-by{font-size:.72rem;color:var(--text-muted);margin-top:4px}

/* ── Animations ─────────────────────────────────────────────── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideInRight{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeInUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.fade-in{animation:fadeInUp .3s ease both}

/* ── Utilities ─────────────────────────────────────────────── */
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}
.justify-between{justify-content:space-between}.gap-2{gap:8px}.gap-3{gap:12px}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
.mb-2{margin-bottom:8px}.mb-4{margin-bottom:16px}
.text-gold{color:var(--gold)}.text-muted{color:var(--text-muted)}
.text-sm{font-size:.8rem}.text-xs{font-size:.72rem}
.w-full{width:100%}.hidden{display:none!important}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── Mobile ─────────────────────────────────────────────────── */
@media(max-width:768px){
  #sidebar{transform:translateX(-100%);box-shadow:4px 0 20px rgba(0,0,0,.4)}
  #sidebar.open{transform:translateX(0)}
  .hamburger-btn{display:flex}
  #main{margin-left:0}
  #page-content{padding:16px}
  .form-row{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .page-header{flex-direction:column;align-items:flex-start}
  #toast-container{left:16px;right:16px;bottom:16px}
  .toast{max-width:100%}
  .modal{max-height:95vh}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast-container"></div>

<script type="module">
// ════════════════════════════════════════════════════════════
// PA GUEST TRACKER — v2.0
// Single file, no module imports between files
// ════════════════════════════════════════════════════════════

// ── VERSION ──────────────────────────────────────────────────
// To release a new version:
// 1. Bump APP_VERSION
// 2. Add entry to WHATS_NEW
// 3. Push — done. No cache busting needed (single file)
const APP_VERSION = "2.0";
const WHATS_NEW = {
  "2.0": {
    date: "May 2026",
    title: "Rebuilt & Stable",
    items: [
      "Rebuilt as single-file app — faster, no import errors",
      "Fixed all profile loading and dashboard errors",
      "Cleaner codebase, easier to update going forward",
    ],
  },
  "1.1": {
    date: "May 2026",
    title: "User Management",
    items: [
      "Super Admin can create users directly in the app",
      "Assign roles and chapters from Users page",
    ],
  },
  "1.0": {
    date: "May 2026",
    title: "Initial Launch",
    items: [
      "Public guest registration — no login required",

const getUpcomingMtgs = async cid => { const now=new Date();now.setHours(0,0,0,0); const s = await getDocs(query(collection(db,"meetings"),where("chapterId","==",cid),orderBy("date","asc"))); return s.docs.map(d=>({id:d.id,...d.data()})).filter(m=>{const d=m.date?.toDate?m.date.toDate():new Date(m.date);return d>=now;}); };

const addFollowup     = async data => addDoc(collection(db,"followups"),{...data,createdAt:serverTimestamp()});
const getUsers        = async () => { const s = await getDocs(query(collection(db,"users"),orderBy("name"))); return s.docs.map(d=>({id:d.id,...d.data()})); };
const updateUserProf  = async (uid,data) => updateDoc(doc(db,"users",uid),{...data,updatedAt:serverTimestamp()});

const markAttendance = async (meetingId,guestId,present) => {
  const mSnap = await getDoc(doc(db,"meetings",meetingId));
  if(!mSnap.exists()) return;
  let attendees = mSnap.data().attendees||[];
  if(present && !attendees.includes(guestId)) attendees.push(guestId);
  else if(!present) attendees = attendees.filter(id=>id!==guestId);
  await updateDoc(doc(db,"meetings",meetingId),{attendees,updatedAt:serverTimestamp()});
  const gSnap = await getDoc(doc(db,"guests",guestId));
  if(!gSnap.exists()) return;
  let ma = gSnap.data().meetingsAttended||[];
  if(present && !ma.includes(meetingId)){
    ma.push(meetingId);
    const upd = {meetingsAttended:ma,updatedAt:serverTimestamp()};
    if(gSnap.data().status==="New") upd.status="Attending";
    await updateDoc(doc(db,"guests",guestId),upd);
  } else if(!present){
    await updateDoc(doc(db,"guests",guestId),{meetingsAttended:ma.filter(id=>id!==meetingId),updatedAt:serverTimestamp()});
  }
};

const t = key => TR[_lang]?.[key] ?? TR.en[key] ?? key;
const setLang = lang => { if(LANGS.includes(lang)){_lang=lang;localStorage.setItem("pa_lang",lang);document.documentElement.lang=lang;} };

const state = { user:null, profile:null, page:"dashboard", chapterId:null, guestId:null, sidebarOpen:false };

// ── HELPERS ───────────────────────────────────────────────────
const fmtDate = v => { if(!v) return "—"; const d=v?.toDate?v.toDate():new Date(v); return d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}); };
const fmtShort = v => { if(!v) return {day:"—",month:"—"}; const d=v?.toDate?v.toDate():new Date(v); return {day:d.getDate(),month:d.toLocaleString("en-IN",{month:"short"}).toUpperCase()}; };
const initials = name => (name||"U").split(" ").map(n=>n[0]).join("").toUpperCase().slice(0,2);

const statusBadge = s => {
  const m={New:["badge-new","statusNew"],Attending:["badge-attending","statusAttending"],Interested:["badge-interested","statusInterested"],Converted:["badge-converted","statusConverted"],NotInterested:["badge-not-interested","statusNotInterested"],Ghosted:["badge-ghosted","statusGhosted"]};
  const [cls,key]=m[s]||["badge-new","statusNew"];
  return `<span class="status-badge ${cls}">${t(key)}</span>`;
};

const showToast = (msg,type="info") => {
  const c=document.getElementById("toast-container");if(!c)return;
  const el=document.createElement("div");el.className=`toast toast-${type}`;el.textContent=msg;c.appendChild(el);
  setTimeout(()=>{el.style.opacity="0";el.style.transform="translateX(100px)";el.style.transition="all .3s ease";setTimeout(()=>el.remove(),300);},3000);
};

const langToggleHTML = () => `<div class="lang-toggle">${LANGS.map(l=>`<button class="lang-btn${_lang===l?" active":""}" data-lang="${l}">${LANG_LABELS[l]}</button>`).join("")}</div>`;

const bindLangToggle = el => {
  if(!el) return;
  el.addEventListener("click",e=>{
    const btn=e.target.closest(".lang-btn");if(!btn)return;
    setLang(btn.dataset.lang);
    render();
  });
};

// ── MODAL HELPER ──────────────────────────────────────────────
const modal = (title,bodyHTML,footerHTML) => {
  const o=document.createElement("div");o.className="modal-overlay";
  o.innerHTML=`<div class="modal"><div class="modal-header"><h2 class="modal-title">${title}</h2><button class="modal-close" id="mc">✕</button></div>${bodyHTML}<div class="modal-footer">${footerHTML}</div></div>`;
  document.body.appendChild(o);
  o.querySelector("#mc").onclick=()=>o.remove();
  o.onclick=e=>{if(e.target===o)o.remove();};
  return o;
};

const routeTo = (page,params={}) => {
  state.page=page;
  if(params.guestId) state.guestId=params.guestId;
  render();
};

        <nav class="sidebar-nav">
          ${navItems.map(n=>`<div class="nav-item${state.page===n.pg?" active":""}" data-pg="${n.pg}">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">${n.ic}</svg>
            <span>${t(n.lk)}</span>
          </div>`).join("")}
        </nav>
        <div class="sidebar-bottom">
          <div class="user-info">
            <div class="user-avatar">${ini}</div>
            <div><div class="user-name">${p.name||"User"}</div><div class="user-role">${roleLabel}</div></div>

          <button class="btn btn-ghost btn-sm btn-full" id="wn-btn" style="margin-bottom:6px;justify-content:flex-start;color:var(--gold);border-color:var(--gold-border)">
            ✨ What's New <span style="margin-left:auto;font-size:.65rem;background:var(--gold);color:var(--navy);padding:1px 6px;border-radius:10px;font-weight:700">v${APP_VERSION}</span>
          </button>
          <button class="btn btn-ghost btn-sm btn-full" id="logout-btn">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
            ${t("logout")}

      <div id="main">
        <header id="header">

                <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
              </svg>
            </button>

  document.querySelector(".sidebar-nav").onclick = e => {
    const item=e.target.closest(".nav-item");if(!item)return;
    state.page=item.dataset.pg;closeSidebar();renderPage();
  };
  document.getElementById("logout-btn").onclick=()=>signOut(auth);
  document.getElementById("wn-btn").onclick=()=>showWhatsNew(true);
  document.getElementById("hbtn").onclick=()=>toggleSidebar();
  document.getElementById("sidebar-overlay").onclick=()=>closeSidebar();
  bindLangToggle(document.getElementById("hlt"));
  renderPage();

const toggleSidebar=()=>{state.sidebarOpen=!state.sidebarOpen;document.getElementById("sidebar").classList.toggle("open",state.sidebarOpen);document.getElementById("sidebar-overlay").classList.toggle("visible",state.sidebarOpen);};
const closeSidebar=()=>{state.sidebarOpen=false;document.getElementById("sidebar")?.classList.remove("open");document.getElementById("sidebar-overlay")?.classList.remove("visible");};

// ── RENDER PAGE ───────────────────────────────────────────────
const renderPage = async () => {
  const content=document.getElementById("page-content");
  content.innerHTML=`<div class="loading-spinner"><div class="spinner"></div></div>`;
  // Update active nav
  document.querySelectorAll(".nav-item").forEach(el=>el.classList.toggle("active",el.dataset.pg===state.page));
  const titles={dashboard:t("dashboard"),guests:t("guests"),meetings:t("meetingsList"),attendance:t("attendancePage"),chapters:t("chaptersList"),users:t("usersList"),"guest-detail":t("guestDetails")};
  const htitle=document.getElementById("htitle");if(htitle)htitle.textContent=titles[state.page]||"PA";
  try{
    switch(state.page){
      case "dashboard": await renderDashboard(content); break;
      case "guests": await renderGuests(content); break;
      case "guest-detail": await renderGuestDetail(content); break;
      case "meetings": await renderMeetings(content); break;
      case "attendance": await renderAttendance(content); break;
      case "chapters": await renderChapters(content); break;
      case "users": await renderUsers(content); break;
      default: await renderDashboard(content);
    }
  }catch(e){content.innerHTML=`<div class="empty-state"><span class="empty-state-icon">⚠️</span><p>${e.message}</p></div>`;}
};

// ── CHAPTER HELPER ────────────────────────────────────────────
const getChaptersForUser = async () => {
  const {role,uid} = state.profile;
  return role==="superAdmin" ? await getChapters() : await getChaptersByAdmin(uid);
};

const getOrSetChapterId = async chapters => {
  if(!state.chapterId && chapters.length) state.chapterId=chapters[0].id;
  return state.chapterId;
};

const chapterSwitcher = (chapters,cid) => chapters.length>1
  ? `<select id="ch-sw" class="form-control" style="max-width:260px;margin-bottom:16px">${chapters.map(c=>`<option value="${c.id}"${c.id===cid?" selected":""}>${c.name}</option>`).join("")}</select>`
  : "";

// ── DASHBOARD ─────────────────────────────────────────────────
const renderDashboard = async el => {
  const {role} = state.profile;
  if(role==="superAdmin"){
    const [chapters,allG]=await Promise.all([getChapters(),getAllGuests()]);
    const s={new:0,attending:0,interested:0,converted:0,notInterested:0,ghosted:0};
    allG.forEach(g=>{if(g.status==="New")s.new++;else if(g.status==="Attending")s.attending++;else if(g.status==="Interested")s.interested++;else if(g.status==="Converted")s.converted++;else if(g.status==="NotInterested")s.notInterested++;else if(g.status==="Ghosted")s.ghosted++;});
    const conv=allG.length?Math.round((s.converted/allG.length)*100):0;
    el.innerHTML=`<div class="fade-in">
      <div class="page-header"><div><h1 class="page-title">${t("dashboard")}</h1><div class="page-subtitle">${t("allChapters")} · ${chapters.length} chapters</div></div></div>
      <div class="stats-grid">
        ${[
          [allG.length,t("totalGuests"),"var(--gold)"],
          [s.converted,t("converted"),"var(--status-converted)"],
          [s.interested,t("interested"),"var(--status-interested)"],
          [s.attending,t("attending"),"var(--status-attending)"],
          [s.new,t("newGuests"),"var(--status-new)"],
          [conv+"%",t("conversionRate"),"var(--gold)"],
        ].map(([v,l,c])=>`<div class="stat-card" style="--accent-color:${c}"><div class="stat-value">${v}</div><div class="stat-label">${l}</div></div>`).join("")}
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Chapter Performance</span></div>
        ${chapters.map(ch=>{const cg=allG.filter(g=>g.chapterId===ch.id);const conv=cg.filter(g=>g.status==="Converted").length;return `
          <div class="guest-item" style="cursor:default">
            <div class="guest-avatar">${(ch.name[0]||"C").toUpperCase()}</div>
            <div class="guest-info"><div class="guest-name">${ch.name}</div><div class="guest-meta">${ch.city||"—"} · ${cg.length} guests · ${conv} converted · ${cg.length?Math.round((conv/cg.length)*100):0}%</div></div>
          </div>`}).join("")}
      </div>
    </div>`;
  } else {
    const chapters=await getChaptersForUser();
    const cid=await getOrSetChapterId(chapters);
    if(!cid){el.innerHTML=`<div class="empty-state"><span class="empty-state-icon">🏠</span><p>No chapter assigned. Contact your Super Admin.</p></div>`;return;}
    const [guests,upcoming]=await Promise.all([getGuests(cid),getUpcomingMtgs(cid)]);
    const next=upcoming[0];
    const now=new Date();
    const monthG=guests.filter(g=>{const d=g.createdAt?.toDate?g.createdAt.toDate():new Date(g.createdAt||0);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});
    const converted=guests.filter(g=>g.status==="Converted").length;
    const nextG=next?guests.filter(g=>g.expectedMeetingId===next.id):[];
    el.innerHTML=`<div class="fade-in">
      <div class="page-header">
        <div><h1 class="page-title">${t("dashboard")}</h1>
          ${chapterSwitcher(chapters,cid)}
          ${chapters.length===1?`<div class="page-subtitle">${chapters[0].name}</div>`:""}
        </div>
        <button class="btn btn-primary" id="dash-add">+ ${t("addGuest")}</button>
      </div>
      <div class="stats-grid">
        ${[[guests.length,t("totalGuests"),"var(--gold)"],[monthG.length,t("thisMonth"),"var(--info)"],[converted,t("converted"),"var(--status-converted)"],[guests.filter(g=>g.status==="Interested").length,t("interested"),"var(--status-interested)"],[guests.filter(g=>g.status==="Attending").length,t("attending"),"var(--status-attending)"],[guests.filter(g=>g.status==="New").length,t("newGuests"),"var(--status-new)"]].map(([v,l,c])=>`<div class="stat-card" style="--accent-color:${c}"><div class="stat-value">${v}</div><div class="stat-label">${l}</div></div>`).join("")}
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-header"><span class="card-title">🗓 ${t("upcomingMeeting")}</span><button class="btn btn-ghost btn-sm" id="dash-mtg">${t("meetings")}</button></div>
        ${next?`<div class="flex items-center gap-3">
          <div class="meeting-date-badge"><span class="meeting-date-day">${fmtShort(next.date).day}</span><span class="meeting-date-month">${fmtShort(next.date).month}</span></div>
          <div><div style="font-weight:600">${next.venue||"PA Meeting"}</div><div style="font-size:.8rem;color:var(--text-muted);margin-top:2px">${nextG.length} guest(s) expected · ${next.attendees?.length||0} confirmed</div></div>
          <button class="btn btn-primary btn-sm" style="margin-left:auto" id="dash-att">${t("markAttendance")}</button>
        </div>`:`<p class="text-muted">${t("noUpcomingMeeting")}</p>`}
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">👤 ${t("recentGuests")}</span><button class="btn btn-ghost btn-sm" id="dash-guests">${t("guests")}</button></div>
        ${guests.slice(0,5).map(g=>`<div class="guest-item" data-gid="${g.id}">
          <div class="guest-avatar">${(g.name[0]||"G").toUpperCase()}</div>
          <div class="guest-info"><div class="guest-name">${g.name}</div><div class="guest-meta">${g.businessName||g.businessType||"—"} · ${g.referredByName||"—"}${g.feePaid?" · <span style='color:var(--status-converted)'>Fee ✓</span>":""}</div></div>
          ${statusBadge(g.status)}
        </div>`).join("")||`<p class="text-muted">${t("noData")}</p>`}
      </div>
    </div>`;

    document.getElementById("dash-add")?.onclick=()=>{state.page="guests";renderPage();};
    document.getElementById("dash-mtg")?.onclick=()=>{state.page="meetings";renderPage();};
    document.getElementById("dash-att")?.onclick=()=>{state.page="attendance";renderPage();};
    document.getElementById("dash-guests")?.onclick=()=>{state.page="guests";renderPage();};
    el.querySelectorAll(".guest-item[data-gid]").forEach(item=>item.onclick=()=>{state.guestId=item.dataset.gid;state.page="guest-detail";renderPage();});
    document.getElementById("ch-sw")?.addEventListener("change",e=>{state.chapterId=e.target.value;renderPage();});
  }
};

// ── GUESTS ────────────────────────────────────────────────────
let _guestFilter="all", _guestSearch="", _guestList=[];

const renderGuests = async el => {
  const chapters=await getChaptersForUser();
  const cid=await getOrSetChapterId(chapters);
  if(!cid){el.innerHTML=`<div class="empty-state"><p>No chapter assigned.</p></div>`;return;}
  _guestList = state.profile.role==="superAdmin"&&cid ? await getGuests(cid) : await getGuests(cid);

  const draw = () => {
    let list=[..._guestList];
    if(_guestFilter!=="all") list=list.filter(g=>g.status===_guestFilter);
    if(_guestSearch) list=list.filter(g=>(g.name||"").toLowerCase().includes(_guestSearch)||(g.phone||"").includes(_guestSearch)||(g.businessName||"").toLowerCase().includes(_guestSearch)||(g.referredByName||"").toLowerCase().includes(_guestSearch));
    el.innerHTML=`<div class="fade-in">
      <div class="page-header">
        <div><h1 class="page-title">${t("guests")}</h1><div class="page-subtitle">${list.length} ${t("guests").toLowerCase()}</div></div>
        <button class="btn btn-primary" id="gadd">+ ${t("addGuest")}</button>
      </div>
      ${chapterSwitcher(chapters,cid)}
      <div class="filter-bar">
        <div class="search-input">
          <svg class="search-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="gsearch" class="form-control" placeholder="${t("search")}..." value="${_guestSearch}">
        </div>
        ${["all","New","Attending","Interested","Converted","NotInterested","Ghosted"].map(f=>`<span class="filter-chip${_guestFilter===f?" active":""}" data-f="${f}">${f==="all"?t("all"):t("status"+f)}</span>`).join("")}
      </div>
      <div id="glist">
        ${list.length?list.map(g=>`<div class="guest-item" data-gid="${g.id}">
          <div class="guest-avatar">${(g.name[0]||"G").toUpperCase()}</div>
          <div class="guest-info"><div class="guest-name">${g.name}</div>
          <div class="guest-meta">${g.businessName||g.businessType||"—"} · ${g.referredByName||"—"}${g.feePaid?" · <span style='color:var(--status-converted)'>Fee ✓</span>":""}</div></div>
          ${statusBadge(g.status)}
        </div>`).join(""):
        `<div class="empty-state"><span class="empty-state-icon">👥</span><p>${t("noData")}</p></div>`}
      </div>
    </div>`;

    el.querySelector("#gadd").onclick=()=>showAddGuestModal(cid);
    el.querySelectorAll(".filter-chip").forEach(c=>c.onclick=()=>{_guestFilter=c.dataset.f;draw();});
    el.querySelector("#gsearch").oninput=e=>{_guestSearch=e.target.value.toLowerCase();draw();};
    el.querySelectorAll(".guest-item[data-gid]").forEach(item=>item.onclick=()=>{state.guestId=item.dataset.gid;state.page="guest-detail";renderPage();});
    document.getElementById("ch-sw")?.addEventListener("change",async e=>{state.chapterId=e.target.value;_guestList=await getGuests(e.target.value);draw();});
  };
  draw();
};

const showAddGuestModal = async cid => {
  const meetings=await getUpcomingMtgs(cid);
  const o=modal(`+ ${t("addGuest")}`,`
    <div class="form-row">
      <div class="form-group"><label class="form-label">${t("guestName")} <span class="required">*</span></label><input id="an" class="form-control" placeholder="${t("guestName")}"></div>
      <div class="form-group"><label class="form-label">${t("guestPhone")} <span class="required">*</span></label><input id="ap" class="form-control" type="tel" maxlength="15"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">${t("businessName")}</label><input id="abn" class="form-control"></div>
      <div class="form-group"><label class="form-label">${t("businessType")}</label><select id="abt" class="form-control"><option value="">— Select —</option>${t("businessTypes").map(b=>`<option value="${b}">${b}</option>`).join("")}</select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">${t("referredByName")} <span class="required">*</span></label><input id="arn" class="form-control"></div>
      <div class="form-group"><label class="form-label">${t("referredByPhone")} <span class="required">*</span></label><input id="arp" class="form-control" type="tel" maxlength="15"></div>
    </div>
    <div class="form-group"><label class="form-label">${t("expectedMeeting")}</label>
      <select id="am" class="form-control"><option value="">${t("notDecided")}</option>${meetings.map(m=>{const d=fmtDate(m.date);return `<option value="${m.id}">${d}${m.venue?" · "+m.venue:""}</option>`;}).join("")}</select>
    </div>
    <div class="form-group"><label class="form-label">${t("feePaid")}</label>
      <div class="radio-group">
        <label class="radio-option" id="afy"><input type="radio" name="afp" value="yes"> ${t("feePaidYes")}</label>
        <label class="radio-option selected" id="afn"><input type="radio" name="afp" value="no" checked> ${t("feePaidNo")}</label>
      </div>
    </div>
    <div id="aerr" class="form-error hidden" style="margin-bottom:8px"></div>`,
    `<button class="btn btn-ghost" id="ac">${t("cancel")}</button><button class="btn btn-primary" id="asv">${t("save")}</button>`);

  o.querySelectorAll('input[name="afp"]').forEach(r=>r.onchange=()=>{o.querySelector("#afy").classList.toggle("selected",o.querySelector('input[name="afp"][value="yes"]').checked);o.querySelector("#afn").classList.toggle("selected",o.querySelector('input[name="afp"][value="no"]').checked);});
  o.querySelector("#ac").onclick=()=>o.remove();
  o.querySelector("#asv").onclick=async()=>{
    const name=o.querySelector("#an").value.trim(),phone=o.querySelector("#ap").value.trim(),refName=o.querySelector("#arn").value.trim(),refPhone=o.querySelector("#arp").value.trim();
    const err=o.querySelector("#aerr");
    if(!name||!phone||!refName||!refPhone){err.textContent=t("required");err.classList.remove("hidden");return;}
    const btn=o.querySelector("#asv");btn.disabled=true;
    try{
      await registerGuest({chapterId:cid,name,phone,businessName:o.querySelector("#abn").value.trim(),businessType:o.querySelector("#abt").value,referredByName:refName,referredByPhone:refPhone,expectedMeetingId:o.querySelector("#am").value||null,meetingDecided:!!o.querySelector("#am").value,feePaid:o.querySelector('input[name="afp"][value="yes"]').checked});
      showToast(t("guestRegistered"),"success");o.remove();
      _guestList=await getGuests(cid);renderPage();
    }catch(e){err.textContent=t("error")+": "+e.message;err.classList.remove("hidden");btn.disabled=false;}
  };
};

// ── GUEST DETAIL ──────────────────────────────────────────────
const renderGuestDetail = async el => {
  if(!state.guestId){state.page="guests";renderPage();return;}
  const [guest,followups]=await Promise.all([getGuest(state.guestId),getFollowups(state.guestId)]);
  if(!guest){el.innerHTML=`<div class="empty-state"><p>Guest not found.</p></div>`;return;}
  const meetings=await getMeetings(guest.chapterId);
  const mMap={};meetings.forEach(m=>{mMap[m.id]=fmtDate(m.date)+(m.venue?" · "+m.venue:"");});
  const canEdit=["superAdmin","chapterAdmin"].includes(state.profile.role);

  const drawDetail=()=>{
    el.innerHTML=`<div class="fade-in">
      <div class="page-header">
        <button class="btn btn-ghost btn-sm" id="gbk">← ${t("back")}</button>
        ${canEdit?`<div class="flex gap-2"><button class="btn btn-ghost btn-sm" id="gedit">${t("edit")}</button><button class="btn btn-danger btn-sm" id="gdel">${t("delete")}</button></div>`:""}
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="flex items-center gap-3" style="margin-bottom:16px">
          <div style="width:52px;height:52px;border-radius:50%;background:var(--gold-dim);border:2px solid var(--gold-border);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.4rem;color:var(--gold);font-weight:700;flex-shrink:0">${(guest.name[0]||"G").toUpperCase()}</div>
          <div style="flex:1"><h2 style="font-family:var(--font-display);font-size:1.3rem">${guest.name}</h2><div style="font-size:.8rem;color:var(--text-muted)">${guest.phone}</div></div>
          ${statusBadge(guest.status)}
        </div>
        <div class="grid-2" style="gap:16px">
          <div><div class="text-xs text-muted mb-1">${t("businessName")}</div><div style="font-size:.875rem">${guest.businessName||"—"}</div></div>
          <div><div class="text-xs text-muted mb-1">${t("businessType")}</div><div style="font-size:.875rem">${guest.businessType||"—"}</div></div>
          <div><div class="text-xs text-muted mb-1">${t("referredByName")}</div><div style="font-size:.875rem">${guest.referredByName||"—"}</div></div>
          <div><div class="text-xs text-muted mb-1">${t("referredByPhone")}</div><div style="font-size:.875rem">${guest.referredByPhone||"—"}</div></div>
          <div><div class="text-xs text-muted mb-1">${t("feePaid")}</div><div style="font-size:.875rem;color:${guest.feePaid?"var(--status-converted)":"var(--text-muted)"}">${guest.feePaid?"✓ "+t("yes"):t("no")}</div></div>
          <div><div class="text-xs text-muted mb-1">Registered</div><div style="font-size:.875rem">${fmtDate(guest.createdAt)}</div></div>
        </div>
        ${canEdit?`<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--navy-border)">
          <div class="text-xs text-muted" style="margin-bottom:8px">${t("updateStatus")}</div>
          <div class="flex gap-2" style="flex-wrap:wrap">
            ${["New","Attending","Interested","Converted","NotInterested","Ghosted"].map(s=>`<span class="filter-chip${guest.status===s?" active":""} su-btn" data-s="${s}">${t("status"+s)}</span>`).join("")}
          </div>
        </div>`:""}
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-header"><span class="card-title">📅 ${t("meetingsAttended")}</span><span style="font-size:.8rem;color:var(--text-muted)">${guest.meetingsAttended?.length||0} total</span></div>
        ${guest.meetingsAttended?.length?guest.meetingsAttended.map(mid=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(30,54,102,.4);font-size:.875rem">📅 ${mMap[mid]||mid}</div>`).join(""):`<p class="text-muted text-sm">${t("noMeetingsAttended")}</p>`}
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">💬 ${t("followUpLog")}</span>${canEdit?`<button class="btn btn-primary btn-sm" id="addf">+ ${t("addFollowUp")}</button>`:""}</div>
        <div id="fu-area">${renderFollowupsHTML(followups)}</div>
      </div>
    </div>`;

    el.querySelector("#gbk").onclick=()=>{state.page="guests";renderPage();};
    el.querySelector("#gedit")?.onclick=()=>showEditGuestModal(guest);
    el.querySelector("#gdel")?.onclick=async()=>{if(!confirm(t("confirmDelete")))return;await deleteGuest(state.guestId);showToast("Deleted","success");state.page="guests";renderPage();};
    el.querySelectorAll(".su-btn").forEach(btn=>btn.onclick=async()=>{await updateGuest(state.guestId,{status:btn.dataset.s});showToast(t("success"),"success");const g=await getGuest(state.guestId);Object.assign(guest,g);drawDetail();});
    el.querySelector("#addf")?.onclick=()=>showFollowupModal(state.guestId,guest.chapterId,async()=>{const fu=await getFollowups(state.guestId);document.getElementById("fu-area").innerHTML=renderFollowupsHTML(fu);});
  };

const meetingCardHTML=(m,past=false)=>{const {day,month}=fmtShort(m.date);const d=m.date?.toDate?m.date.toDate():new Date(m.date);return `<div class="meeting-card" data-mid="${m.id}" style="${past?"opacity:.65":""}"><div class="flex items-center gap-3" style="flex:1"><div class="meeting-date-badge"><span class="meeting-date-day">${day}</span><span class="meeting-date-month">${month}</span></div><div><div style="font-weight:600;font-size:.9rem">${m.venue||"PA Meeting"}</div><div style="font-size:.75rem;color:var(--text-muted);margin-top:2px">${d.toLocaleDateString("en-IN",{weekday:"long"})} · ${m.attendees?.length||0} attended</div>${m.notes?`<div style="font-size:.75rem;color:var(--text-muted);margin-top:2px">${m.notes}</div>`:""}</div></div><svg width="16" height="16" fill="none" stroke="var(--text-muted)" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>`;};

    <div style="margin-bottom:16px"><div class="text-xs text-muted mb-1">Expected (${expected.length})</div>${expected.length?expected.map(g=>`<div style="font-size:.875rem;padding:6px 0;border-bottom:1px solid rgba(30,54,102,.4)">${g.name}${g.feePaid?" · <span style='color:var(--status-converted)'>Fee ✓</span>":""}</div>`).join(""):`<p class="text-muted text-sm">None</p>`}</div>

const renderAttendance = async el => {
  const chapters=await getChaptersForUser();
  const cid=await getOrSetChapterId(chapters);
  if(!cid){el.innerHTML=`<div class="empty-state"><p>No chapter assigned.</p></div>`;return;}
  const [meetings,guests]=await Promise.all([getMeetings(cid),getGuests(cid)]);
  const now=new Date();
  const upcoming=meetings.filter(m=>{const d=m.date?.toDate?m.date.toDate():new Date(m.date);return d>=now;});
  let selMid=state.selMeeting||(upcoming[0]?.id||meetings[0]?.id||null);
  state.selMeeting=selMid;
  let selMeeting=selMid?meetings.find(m=>m.id===selMid):null;

  const draw = () => {
    const gForMeeting=guests.filter(g=>g.expectedMeetingId===selMid||(selMeeting?.attendees||[]).includes(g.id)||["Attending","Interested","New"].includes(g.status));
    el.innerHTML=`<div class="fade-in">
      <div class="page-header">
        <div><h1 class="page-title">${t("attendancePage")}</h1><div class="page-subtitle">${selMeeting?fmtDate(selMeeting.date)+(selMeeting.venue?" · "+selMeeting.venue:""):"Select a meeting"}</div></div>
        <div id="save-ind" class="hidden" style="font-size:.8rem;color:var(--status-converted)">✓ ${t("attendanceSaved")}</div>
      </div>
      <div class="card" style="margin-bottom:16px">
        ${chapterSwitcher(chapters,cid)}
        <div class="form-group" style="margin-bottom:0"><label class="form-label">${t("selectMeeting")}</label>
          <select id="msel" class="form-control">
            ${meetings.map(m=>`<option value="${m.id}"${m.id===selMid?" selected":""}>${fmtDate(m.date)}${m.venue?" · "+m.venue:""}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">${t("guests")}</span><span style="font-size:.8rem;color:var(--text-muted)">${(selMeeting?.attendees||[]).length} / ${gForMeeting.length} present</span></div>
        ${!selMeeting||!gForMeeting.length?`<div class="empty-state" style="padding:24px"><p>${t("noGuestsForMeeting")}</p></div>`:
        gForMeeting.map(g=>{const present=(selMeeting?.attendees||[]).includes(g.id);return `<div class="attendance-item${present?" present":""}" id="att-${g.id}">
          <div><div style="font-weight:600;font-size:.875rem">${g.name}</div><div style="font-size:.75rem;color:var(--text-muted)">${g.businessName||g.businessType||"—"} · ${g.referredByName||"—"}${g.feePaid?" · <span style='color:var(--status-converted)'>Fee ✓</span>":""}</div></div>
          <label class="toggle-switch"><input type="checkbox" class="att-tog" data-gid="${g.id}"${present?" checked":""}><span class="toggle-track"></span></label>
        </div>`;}).join("")}
      </div>
    </div>`;

    document.getElementById("msel").onchange=async e=>{selMid=e.target.value;state.selMeeting=selMid;selMeeting=meetings.find(m=>m.id===selMid)||null;draw();};
    document.getElementById("ch-sw")?.addEventListener("change",async e=>{state.chapterId=e.target.value;renderPage();});
    el.querySelectorAll(".att-tog").forEach(tog=>tog.onchange=async e=>{
      const gid=e.target.dataset.gid,present=e.target.checked;
      try{
        await markAttendance(selMid,gid,present);
        selMeeting=await getMeeting(selMid);
        document.getElementById(`att-${gid}`).classList.toggle("present",present);
        const ind=document.getElementById("save-ind");ind.classList.remove("hidden");setTimeout(()=>ind.classList.add("hidden"),2000);
      }catch(err){showToast(err.message,"error");e.target.checked=!present;}
    });
  };
  draw();
};

      </div>
    </div>
    <div class="form-group"><label class="form-label">${t("userEmail")} <span class="required">*</span></label><input id="ue" class="form-control" type="email" autocomplete="off"></div>
    <div class="form-group"><label class="form-label">Password <span class="required">*</span></label>
      <div style="position:relative"><input id="upw" class="form-control" type="password" placeholder="Min 6 characters" autocomplete="new-password" style="padding-right:52px">
      <button id="tpw" type="button" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.75rem;font-weight:600">SHOW</button></div>
    </div>
    <div class="form-group" id="uc-cg">
      <label class="form-label">${t("userChapters")}</label>
      <div style="max-height:180px;overflow-y:auto;background:var(--navy);border:1px solid var(--navy-border);border-radius:var(--radius-sm);padding:8px">
        ${chapters.map(c=>`<label style="display:flex;align-items:center;gap:8px;padding:6px;cursor:pointer;border-radius:4px"><input type="checkbox" class="uc-ch" value="${c.id}"><span style="font-size:.875rem">${c.name}${c.city?" — "+c.city:""}</span></label>`).join("")}
      </div>
    </div>
    <div id="uerr" class="form-error hidden" style="margin-bottom:8px"></div>`,
    `<button class="btn btn-ghost" id="ucan">${t("cancel")}</button><button class="btn btn-primary" id="usv"><span id="usvl">Create User</span><div id="usp" class="spinner hidden" style="width:16px;height:16px;border-width:2px;margin-left:6px"></div></button>`);

  o.querySelector("#ur").onchange=e=>{o.querySelector("#uc-cg").style.display=e.target.value==="superAdmin"?"none":"block";};
  o.querySelector("#tpw").onclick=()=>{const pw=o.querySelector("#upw"),btn=o.querySelector("#tpw");pw.type=pw.type==="password"?"text":"password";btn.textContent=pw.type==="password"?"SHOW":"HIDE";};
  o.querySelector("#ucan").onclick=()=>o.remove();
  o.querySelector("#usv").onclick=async()=>{
    const name=o.querySelector("#un").value.trim(),email=o.querySelector("#ue").value.trim(),pw=o.querySelector("#upw").value,role=o.querySelector("#ur").value;
    const cids=[...o.querySelectorAll(".uc-ch:checked")].map(c=>c.value);
    const err=o.querySelector("#uerr");err.classList.add("hidden");
    if(!name){err.textContent="Name is required.";err.classList.remove("hidden");return;}
    if(!email||!email.includes("@")){err.textContent="Valid email is required.";err.classList.remove("hidden");return;}
    if(!pw||pw.length<6){err.textContent="Password must be at least 6 characters.";err.classList.remove("hidden");return;}
    const btn=o.querySelector("#usv");o.querySelector("#usvl").textContent="Creating...";o.querySelector("#usp").classList.remove("hidden");btn.disabled=true;
    try{
      const sa=getSecondaryAuth();
      const {user:nu}=await createUserWithEmailAndPassword(sa,email,pw);
      await updateProfile(nu,{displayName:name});
      await createUserProf(nu.uid,{name,email,role,chapterIds:role==="superAdmin"?[]:cids});
      await sa.signOut();
      showToast("User created!","success");o.remove();renderPage();
    }catch(e){
      let msg=e.message||"Failed.";
      if(e.code==="auth/email-already-in-use")msg="Email already registered.";
      if(e.code==="auth/weak-password")msg="Password too weak.";
      err.textContent=msg;err.classList.remove("hidden");btn.disabled=false;o.querySelector("#usvl").textContent="Create User";o.querySelector("#usp").classList.add("hidden");
    }
  };
};

const showEditUserModal=(u,chapters,el)=>{
  const o=modal(`${t("edit")}: ${u.name||u.email}`,`
    <div class="form-row">
      <div class="form-group"><label class="form-label">${t("userName")}</label><input id="eun" class="form-control" value="${u.name||""}"></div>
      <div class="form-group"><label class="form-label">${t("userRole")}</label>
        <select id="eur" class="form-control">
          <option value="superAdmin"${u.role==="superAdmin"?" selected":""}>${t("roleSuperAdmin")}</option>
          <option value="chapterAdmin"${u.role==="chapterAdmin"?" selected":""}>${t("roleChapterAdmin")}</option>
          <option value="desk"${u.role==="desk"?" selected":""}>${t("roleDesk")}</option>
        </select>
      </div>
    </div>
    <div class="form-group" id="eu-cg" ${u.role==="superAdmin"?"style='display:none'":""}>
      <label class="form-label">${t("userChapters")}</label>
      <div style="max-height:200px;overflow-y:auto;background:var(--navy);border:1px solid var(--navy-border);border-radius:var(--radius-sm);padding:8px">
        ${chapters.map(c=>`<label style="display:flex;align-items:center;gap:8px;padding:6px;cursor:pointer;border-radius:4px"><input type="checkbox" class="eu-ch" value="${c.id}"${(u.chapterIds||[]).includes(c.id)?" checked":""}><span style="font-size:.875rem">${c.name}${c.city?" — "+c.city:""}</span></label>`).join("")}
      </div>
    </div>
    <div id="euerr" class="form-error hidden" style="margin-bottom:8px"></div>`,
    `<button class="btn btn-ghost" id="eucan">${t("cancel")}</button><button class="btn btn-primary" id="eusv">${t("save")}</button>`);

  o.querySelector("#eur").onchange=e=>{o.querySelector("#eu-cg").style.display=e.target.value==="superAdmin"?"none":"block";};
  o.querySelector("#eucan").onclick=()=>o.remove();
  o.querySelector("#eusv").onclick=async()=>{
    const role=o.querySelector("#eur").value;
    try{await updateUserProf(u.id,{name:o.querySelector("#eun").value.trim(),role,chapterIds:role==="superAdmin"?[]:[...o.querySelectorAll(".eu-ch:checked")].map(c=>c.value)});showToast(t("success"),"success");o.remove();renderPage();}
    catch(e){o.querySelector("#euerr").textContent=e.message;o.querySelector("#euerr").classList.remove("hidden");}
  };
};

const showDeleteUserModal=(uid,name,el)=>{
  const o=modal(`<span style="color:var(--danger)">Delete User</span>`,`<p style="color:var(--text-secondary);margin-bottom:8px">Delete <strong>${name}</strong>?</p><p style="color:var(--text-muted);font-size:.8rem">This removes them from the app.</p><div id="duerr" class="form-error hidden" style="margin-bottom:8px"></div>`,
    `<button class="btn btn-ghost" id="ducan">${t("cancel")}</button><button class="btn btn-danger" id="ducon">Delete</button>`);
  o.querySelector("#ducan").onclick=()=>o.remove();
  o.querySelector("#ducon").onclick=async()=>{
    try{await deleteDoc(doc(db,"users",uid));showToast("User removed.","success");o.remove();renderPage();}
    catch(e){o.querySelector("#duerr").textContent=e.message;o.querySelector("#duerr").classList.remove("hidden");}
  };
};

// ── MAIN RENDER ───────────────────────────────────────────────
const render = () => {
  if(window.location.hash==="#register"){renderRegisterPage();return;}
  if(!state.user){renderLogin();return;}
  renderShell();
};

// ── AUTH ──────────────────────────────────────────────────────
onAuthStateChanged(auth, async user => {
  if(user){
    const profile=await getUserProfile(user.uid);
    if(!profile){showToast("Profile not found. Contact admin.","error");await signOut(auth);return;}
    profile.uid=user.uid; // always attach uid
    state.user=user;
    state.profile=profile;
    render();
  } else {
    state.user=null;state.profile=null;
    render();
  }
});

window.addEventListener("hashchange",()=>{
  if(window.location.hash==="#register") renderRegisterPage();
  else if(state.user) render();
});
</script>

<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
  }
</script>
